<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Trèfle - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lato', sans-serif; background-color: #FDF9F2; color: #3C2C19; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .sign-up-box { background: white; padding: 40px 30px; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); width: 340px; border: 1px solid rgba(0,0,0,0.03); }
        h2 { text-align: center; font-family: 'Fraunces', serif; color: #8C4726; margin-bottom: 25px; font-weight: 600; letter-spacing: 0.5px; }
        .input-field { width: 100%; padding: 12px; margin: 10px 0; border: none; border-bottom: 1px solid rgba(0, 0, 0, 0.1); font-size: 14px; outline: none; background-color: transparent; color: #3C2C19; }
        .input-field::placeholder { color: #b0a496; }
        .input-field:focus { border-bottom: 1px solid #8C4726; }
        .submit-btn { width: 100%; padding: 12px; background-color: #3C2C19; color: white; border: none; border-radius: 2px; cursor: pointer; font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-top: 15px; transition: background-color 0.2s; }
        .submit-btn:hover { background-color: #8C4726; }
        .back-home { display: block; text-align: center; margin-top: 20px; font-size: 12px; color: #b0a496; text-decoration: none; }
        .back-home:hover { color: #3C2C19; }
    </style>
</head>
<body>

<div class="sign-up-box">
    <h2>Customer Sign In</h2>
    
    <form id="registrationForm">
        <input type="text" id="firstName" placeholder="First Name" required class="input-field">
        <input type="text" id="lastName" placeholder="Last Name" required class="input-field">
        <input type="email" id="email" placeholder="Email Address" required class="input-field">
        <input type="tel" id="phone" placeholder="Phone Number" required class="input-field">
        <button type="submit" class="submit-btn">Sign Up / In</button>
    </form>

    <a href="index.html" class="back-home">< Back to Home</a>
</div>

<script>
    document.getElementById('registrationForm').addEventListener('submit', function(e) {
        e.preventDefault(); 

        const data = {
            data: [{
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value
            }]
        };

        // 这里已经连接了你的 SheetDB
        const sheetDBUrl = "https://sheetdb.io/api/v1/xghmswz8jh8yg";

        fetch(sheetDBUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            alert('Sign Up Successful! 登录成功！');
            document.getElementById('registrationForm').reset(); // 清空输入框
            window.location.href = "index.html"; // 成功后自动跳回主页
        })
        .catch(error => {
            alert('发生错误，请稍后再试');
            console.error('Error:', error);
        });
    });
</script>

</body>
</html>
