<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping and Delivery - Le Trèfle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Global Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #FDF9F2; 
            color: #937A62;
            font-family: 'Lato', sans-serif;
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top White Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 95px; 
            padding: 0 50px;
            background-color: #ffffff; 
            position: relative;
            z-index: 1001;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }

        /* Desktop Navigation */
        .nav-left {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .nav-item {
            position: relative;
            display: inline-block;
        }

        .nav-link {
            font-size: 13px;
            font-weight: 700;
            color: #3C2C19;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 10px 0;
            transition: opacity 0.2s ease;
            cursor: pointer;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        .dropdown-arrow {
            font-size: 10px;
            margin-left: 2px;
            transition: transform 0.2s ease;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #ffffff;
            min-width: 200px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.05);
            padding: 10px 0;
            z-index: 1002;
        }

        .dropdown-menu a {
            display: block;
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 700;
            color: #3C2C19;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.2s ease;
        }

        .dropdown-menu a:hover {
            background-color: #FDF9F2;
        }

        .nav-item:hover .dropdown-menu {
            display: block;
        }

        .nav-item:hover .dropdown-arrow {
            transform: rotate(180deg);
        }

        /* Center Logo */
        .logo-wrapper {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }

        .logo {
            font-family: 'Fraunces', serif;
            font-size: 38px; 
            font-weight: 600; 
            color: #8C4726; 
            line-height: 1;
            letter-spacing: -0.5px;
        }

        .logo-tagline {
            font-family: 'Fraunces', serif;
            font-size: 11px;
            font-weight: 300;
            font-style: italic;
            color: #8C4726;
            letter-spacing: 0.8px;
            margin-top: 3px;
            text-transform: lowercase;
            white-space: nowrap;
        }

        /* Right Nav & Icons */
        .nav-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            color: #3C2C19;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .icon-btn:hover {
            opacity: 0.7;
        }

        .icon-svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #3C2C19;
            stroke-width: 1.3;
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            flex-direction: column;
            gap: 5px;
            padding: 8px 0;
        }

        .hamburger span {
            display: block;
            width: 22px;
            height: 1.5px;
            background-color: #3C2C19;
        }

        .mobile-menu {
            display: none;
            flex-direction: column;
            background-color: #ffffff;
            width: 100%;
            padding: 10px 24px 20px 24px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .mobile-menu.active {
            display: flex;
        }

        .mobile-menu .nav-link {
            padding: 12px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            font-size: 14px;
            justify-content: space-between;
        }

        .mobile-sub-menu {
            display: none;
            flex-direction: column;
            background-color: #FDF9F2;
            padding: 5px 15px;
        }

        .mobile-sub-menu.open {
            display: flex;
        }

        .mobile-sub-menu a {
            padding: 10px 0;
            font-size: 13px;
            color: #3C2C19;
            text-decoration: none;
            font-weight: 700;
        }

        /* Search Banner */
        .search-banner {
            width: 100%;
            background-color: #ffffff; 
            padding: 20px 0 30px 0;
            display: flex;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.015);
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }

        .search-block-wrapper {
            width: 80%; 
            max-width: 850px;
            position: relative;
            display: flex;
            align-items: center;
        }

        .inline-search-input {
            width: 100%;
            height: 40px; 
            border: none;
            border-bottom: 1px solid rgba(0, 0, 0, 0.15); 
            font-size: 16px;
            outline: none;
            color: #3C2C19;
            padding-right: 35px;
            background: transparent;
            font-family: 'Lato', sans-serif;
        }

        .inline-search-input::placeholder {
            color: #A39B92;
        }

        .search-icon-btn {
            position: absolute;
            right: 0;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
        }

        .search-icon-svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #3C2C19;
            stroke-width: 1.5;
        }

        /* Main Content */
        .shipping-container {
            width: 90%; 
            max-width: 1000px; 
            margin: 60px auto 40px auto;
            padding: 0 20px;
            flex: 1;
        }

        .page-title {
            font-family: 'Fraunces', serif;
            font-size: 52px;
            font-weight: 700;
            color: #8C4726; 
            margin-bottom: 40px;
            letter-spacing: -0.5px;
            text-align: left;
        }

        .section-title {
            font-family: 'Fraunces', serif;
            font-size: 34px;
            font-weight: 700;
            color: #3C2C19; 
            margin-top: 45px;
            margin-bottom: 20px;
            text-align: left;
            scroll-margin-top: 30px;
        }

        .shipping-text {
            font-size: 19px;
            color: #937A62;
            margin-bottom: 20px;
            text-align: left;
        }

        .content-bold {
            font-weight: 700;
            color: #937A62; 
        }

        .heart-icon {
            display: inline-block;
            font-size: 18px;
            color: #937A62;
            margin-left: 3px;
        }

        .text-spacing {
            margin-top: 15px;
        }

        /* Footer */
        footer {
            margin-top: auto;
            padding: 40px 20px 50px 20px;
            width: 90%;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .footer-email {
            font-size: 19px; 
            color: #937A62; 
            font-weight: 400;
            text-align: left;
        }

        .footer-email a {
            color: #937A62; 
            font-size: 19px; 
            font-weight: 700; 
            text-decoration: underline;
        }

        @media screen and (max-width: 850px) {
            header {
                padding: 0 20px;
                height: 85px;
            }

            .nav-left, .nav-right .nav-link {
                display: none;
            }

            .hamburger {
                display: flex;
            }

            .logo {
                font-size: 28px;
            }

            .logo-tagline {
                font-size: 9.5px;
            }

            .page-title {
                font-size: 36px;
            }

            .section-title {
                font-size: 26px;
            }

            .shipping-text
